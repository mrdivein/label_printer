name: Test and release

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  # A new __version__ in labelapp/version.py on the default branch builds the Windows installer and publishes it,
  # with latest.json, as a GitHub Release of this repository. Installed apps pick it up within 4 hours.
  # A version that already has a release is skipped. Needs the repository to be public (apps read releases anonymously).
  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check whether this version is already released
        id: ver
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('labelapp/version.py').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VER already exists, skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build app
        if: steps.ver.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm packaging_qt.spec
      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=${{ steps.ver.outputs.version }}" installer/temly.iss
      - name: Publish the release
        if: steps.ver.outputs.skip == 'false'
        run: |
          VER=${{ steps.ver.outputs.version }}
          FILE="Temly-Setup-$VER.exe"
          cd dist
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$FILE")
          printf '{"version":"%s","file":"%s","sha256":"%s","size":%s}\n' "$VER" "$FILE" "$SHA" "$SIZE" > latest.json
          cat latest.json
          gh release create "v$VER" "$FILE" latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Temly $VER" --generate-notes
